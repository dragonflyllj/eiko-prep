<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A90D9">
<title>Mimi's Phonics Quest</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- top bar: back + stars -->
<header id="topbar" class="hidden">
  <button id="backBtn" class="round-btn" aria-label="Back to map"></button>
  <div id="lvlLabel" class="lvl-label"></div>
  <div id="starCount" class="star-pill"></div>
</header>

<main id="app">

  <!-- QUEST MAP (home) -->
  <section id="map" class="screen active">
    <div class="map-head">
      <div class="map-title-row">
        <div id="mapCat" class="hero-mini big"></div>
        <div>
          <h1 class="app-title">Mimi's Phonics Quest</h1>
          <p class="app-sub">和咪咪一起闯关学英语!</p>
        </div>
      </div>
      <div class="map-head-btns">
        <div id="mapStars" class="star-pill"></div>
        <button id="stickerBtn" class="star-pill as-btn"></button>
      </div>
      <div id="mapBubble" class="bubble small"></div>
    </div>
    <div id="mapTrail" class="map-trail"></div>
    <a class="exit-link" href="/">&larr; Eik&#333; Prep home</a>
  </section>

  <!-- LETTER CARD -->
  <section id="letterCard" class="screen">
    <div id="lcCard" class="big-card"></div>
    <div class="btn-row">
      <button id="lcHear" class="btn btn-blue"></button>
      <button id="lcSay" class="btn btn-orange"></button>
    </div>
    <button id="lcDone" class="btn btn-green btn-wide"></button>
    <div class="dots" id="lcDots"></div>
  </section>

  <!-- GAME: SOUND POP -->
  <section id="gPop" class="screen">
    <div class="game-head">
      <div id="popPrompt" class="game-prompt"></div>
      <button id="popHear" class="round-btn big" aria-label="Hear the sound again"></button>
    </div>
    <div id="popArea" class="pop-area"></div>
    <div id="popProgress" class="game-progress"></div>
  </section>

  <!-- GAME: WORD BUILDER -->
  <section id="gBuild" class="screen">
    <div id="buildPic" class="build-pic"></div>
    <div id="buildSlots" class="build-slots"></div>
    <div id="buildTiles" class="build-tiles"></div>
    <div id="buildProgress" class="game-progress"></div>
  </section>

  <!-- GAME: RHYME MATCH -->
  <section id="gRhyme" class="screen">
    <h2 class="sec-title">Rhyme Match</h2>
    <p class="sec-sub">Find two words that rhyme, like <b>cat</b> and <b>hat</b>!</p>
    <div id="rhymeGrid" class="rhyme-grid"></div>
  </section>

  <!-- QUIZ (boss levels) -->
  <section id="quiz" class="screen">
    <div class="quiz-head">
      <div id="quizNum" class="game-progress"></div>
      <div id="quizCat" class="hero-mini"></div>
    </div>
    <div id="quizQ" class="quiz-q"></div>
    <div id="quizOpts" class="quiz-opts"></div>
  </section>

  <!-- TALK -->
  <section id="talk" class="screen">
    <div class="talk-stage">
      <div id="talkCat" class="hero-box small"></div>
      <div id="talkBubble" class="bubble talk"></div>
    </div>
    <div id="talkPrompt" class="talk-prompt"></div>
    <div id="talkOpts" class="talk-opts"></div>
    <div id="talkProgress" class="game-progress"></div>
  </section>

  <!-- STORY -->
  <section id="story" class="screen">
    <div id="storyScene" class="story-scene"></div>
    <div id="storyText" class="story-text"></div>
    <div class="btn-row">
      <button id="storyRead" class="btn btn-blue"></button>
      <button id="storyNext" class="btn btn-orange"></button>
    </div>
    <div class="dots" id="storyDots"></div>
  </section>

  <!-- STICKER BOOK -->
  <section id="stickers" class="screen">
    <h2 class="sec-title">My Sticker Book</h2>
    <p class="sec-sub">Win stars to get more stickers! 集星星换贴纸!</p>
    <div id="stickerGrid" class="sticker-grid"></div>
  </section>

</main>

<!-- level-clear celebration overlay -->
<div id="celebrate" class="celebrate hidden">
  <div class="cel-inner">
    <div id="celCat" class="hero-box"></div>
    <div id="celMsg" class="cel-msg"></div>
    <div id="celStars" class="cel-stars"></div>
    <button id="celBtn" class="btn btn-green btn-wide">Next!</button>
  </div>
</div>

<!-- try-again overlay -->
<div id="failbox" class="celebrate hidden">
  <div class="cel-inner">
    <div id="failCat" class="hero-box"></div>
    <div id="failMsg" class="cel-msg blue"></div>
    <div class="btn-row" style="margin:0">
      <button id="failRetry" class="btn btn-orange">Try again!</button>
      <button id="failMap" class="btn btn-blue">Map</button>
    </div>
  </div>
</div>
<div id="confetti"></div>

<script src="art.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
